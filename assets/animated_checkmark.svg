<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    
    <style>
      .circle-bg {
        fill: none;
        stroke: #AC41FF;
        stroke-width: 6;
        stroke-dasharray: 339;
        stroke-dashoffset: 339;
        animation: drawCircle 0.6s cubic-bezier(0.65, 0, 0.45, 1) 0.1s forwards;
      }

      .checkmark {
        fill: none;
        stroke: #AC41FF;
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 80;
        stroke-dashoffset: 80;
        animation: drawCheck 0.4s cubic-bezier(0.65, 0, 0.45, 1) 0.7s forwards;
      }

      .glow {
        fill: none;
        stroke: #AC41FF;
        stroke-width: 8;
        stroke-dasharray: 339;
        stroke-dashoffset: 339;
        opacity: 0.2;
        animation: drawCircle 0.6s cubic-bezier(0.65, 0, 0.45, 1) 0.1s forwards;
        filter: blur(3px);
      }

      .pulse {
        fill: #AC41FF;
        opacity: 0;
        animation: pulse 0.4s ease-out 1.1s forwards;
      }

      @keyframes drawCircle {
        to { stroke-dashoffset: 0; }
      }

      @keyframes drawCheck {
        to { stroke-dashoffset: 0; }
      }

      @keyframes pulse {
        0%   { opacity: 0.35; transform: scale(0.85); transform-origin: 60px 60px; }
        100% { opacity: 0; transform: scale(1.2); transform-origin: 60px 60px; }
      }
    </style>
  </defs>

  <!-- Pulse burst -->
  <circle class="pulse" cx="60" cy="60" r="54"/>

  <!-- Glow ring -->
  <circle class="glow" cx="60" cy="60" r="54" stroke-linecap="round"
          transform="rotate(-90 60 60)"/>

  <!-- Main circle -->
  <circle class="circle-bg" cx="60" cy="60" r="54" stroke-linecap="round"
          transform="rotate(-90 60 60)"/>

  <!-- Checkmark -->
  <polyline class="checkmark" points="34,62 51,79 84,42"/>
</svg>