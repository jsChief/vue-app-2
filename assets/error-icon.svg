<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" width="120" height="120">
  <defs>
    <style>
      .pulse-ring {
        opacity: 0;
        transform-origin: 60px 60px;
        animation: pulse 1.8s ease-out 1.3s;
      }

      .icon-group {
        transform-origin: 60px 60px;
        animation: shake 1.8s ease 1.1s infinite;
      }

      .circle {
        stroke-dasharray: 314;
        stroke-dashoffset: 314;
        animation: draw-circle 0.6s cubic-bezier(0.65, 0, 0.45, 1) 0.1s forwards;
      }

      .x-line-1 {
        stroke-dasharray: 57;
        stroke-dashoffset: 57;
        animation: draw-line 0.3s ease 0.75s forwards;
      }

      .x-line-2 {
        stroke-dasharray: 57;
        stroke-dashoffset: 57;
        animation: draw-line 0.3s ease 0.95s forwards;
      }

      @keyframes draw-circle {
        to { stroke-dashoffset: 0; }
      }

      @keyframes draw-line {
        to { stroke-dashoffset: 0; }
      }

      @keyframes pulse {
        0%   { opacity: 0.6; transform: scale(1); }
        100% { opacity: 0;   transform: scale(1.55); }
      }

      @keyframes shake {
        0%, 100% { transform: rotate(0deg); }
        20%      { transform: rotate(-6deg); }
        40%      { transform: rotate(6deg); }
        60%      { transform: rotate(-4deg); }
        80%      { transform: rotate(4deg); }
      }
    </style>
  </defs>

  <!-- Pulse ring -->
  <circle class="pulse-ring" cx="60" cy="60" r="54"
    stroke="#AC41FF" stroke-width="3" fill="none"/>

  <g class="icon-group">
    <!-- Glow fill -->
    <circle cx="60" cy="60" r="46" fill="rgba(172,65,255,0.07)"/>

    <!-- Main circle -->
    <circle class="circle" cx="60" cy="60" r="50"
      stroke="#AC41FF" stroke-width="4"
      stroke-linecap="round"
      fill="none"
      transform="rotate(-90 60 60)"/>

    <!-- X line 1 -->
    <line class="x-line-1"
      x1="40" y1="40" x2="80" y2="80"
      stroke="#AC41FF" stroke-width="4.5" stroke-linecap="round"/>

    <!-- X line 2 -->
    <line class="x-line-2"
      x1="80" y1="40" x2="40" y2="80"
      stroke="#AC41FF" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
