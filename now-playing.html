<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Now Playing</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="./js/TW3.4.17.js"></script>
  <script src="./js/vue2.js"></script>
  <style>
    :root {
      --brand: #AC41FF;
      --brand-dim: rgba(172, 65, 255, 0.18);
      --brand-glow: rgba(172, 65, 255, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080810;
      font-family: 'DM Sans', sans-serif;
      color: #fff;
      min-height: 100vh;
      overflow: hidden;
    }

    h1, h2, h3, .syne { font-family: 'Syne', sans-serif; }

    /* SVG Background */
    #bg-svg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .shape-float {
      animation: floatShape var(--dur, 14s) ease-in-out infinite alternate;
      transform-origin: center;
      opacity: var(--op, 0.18);
    }

    @keyframes floatShape {
      0%   { transform: translate(0px, 0px) rotate(0deg) scale(1); }
      100% { transform: translate(var(--tx, 18px), var(--ty, -22px)) rotate(var(--rot, 25deg)) scale(var(--sc, 1.08)); }
    }

    .shape-pulse {
      animation: pulseBeat var(--pdur, 3.5s) ease-in-out infinite;
    }

    @keyframes pulseBeat {
      0%, 100% { opacity: var(--op, 0.18); }
      50%       { opacity: calc(var(--op, 0.18) * 2.2); }
    }

    /* Card */
    .card {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 28px;
    }

    /* Album art */
    .album-art {
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 60px rgba(172, 65, 255, 0.25), 0 24px 48px rgba(0,0,0,0.6);
    }

    .album-art-inner {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a0a2e 0%, #2d0d4e 40%, #0a0a1a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .vinyl-ring {
      border-radius: 50%;
      border: 2px solid rgba(172,65,255,0.3);
      position: absolute;
      animation: spinRing var(--s, 8s) linear infinite;
    }

    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }

    /* Progress bar */
    .progress-track {
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #AC41FF, #d480ff);
      position: relative;
      transition: width 0.3s linear;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      right: -5px;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px var(--brand-glow);
    }

    /* Buttons */
    .ctrl-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      background: none;
      color: rgba(255,255,255,0.55);
      transition: color 0.2s, transform 0.15s;
    }

    .ctrl-btn:hover { color: #fff; transform: scale(1.12); }

    .play-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #AC41FF, #c96aff);
      box-shadow: 0 0 24px rgba(172,65,255,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 36px rgba(172,65,255,0.75);
    }

    .play-btn:active { transform: scale(0.96); }

    /* Waveform bars */
    .wave-bar {
      width: 3px;
      border-radius: 999px;
      background: var(--brand);
      animation: waveBounce var(--wd, 0.9s) ease-in-out infinite alternate;
      transform-origin: bottom;
    }

    @keyframes waveBounce {
      from { transform: scaleY(0.2); opacity: 0.4; }
      to   { transform: scaleY(1);   opacity: 1; }
    }

    /* Heart like */
    .heart-btn { cursor: pointer; transition: transform 0.2s; }
    .heart-btn:hover { transform: scale(1.2); }
    .heart-btn.liked svg { fill: #ff4d8f; stroke: #ff4d8f; }

    /* Queue item */
    .queue-item {
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      transition: background 0.18s;
    }
    .queue-item:hover { background: rgba(255,255,255,0.06); }
    .queue-item.active { background: rgba(172,65,255,0.15); border: 1px solid rgba(172,65,255,0.25); }

    /* Volume slider */
    input[type=range] {
      -webkit-appearance: none;
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #AC41FF;
      box-shadow: 0 0 6px rgba(172,65,255,0.6);
    }
  </style>
</head>
<body>

<div id="app">

  <!-- Generative SVG Background -->
  <svg id="bg-svg" :viewBox="`0 0 ${vw} ${vh}`" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
        <stop offset="0%"   stop-color="#160828" />
        <stop offset="100%" stop-color="#060610" />
      </radialGradient>
      <radialGradient id="purpleBloom" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#AC41FF" stop-opacity="0.25" />
        <stop offset="100%" stop-color="#AC41FF" stop-opacity="0" />
      </radialGradient>
    </defs>

    <!-- Base fill -->
    <rect width="100%" height="100%" fill="url(#bgGrad)" />

    <!-- Ambient bloom -->
    <ellipse
      v-for="b in blooms" :key="'b'+b.id"
      :cx="b.cx" :cy="b.cy"
      :rx="b.rx" :ry="b.ry"
      fill="url(#purpleBloom)"
      :style="`--op:${b.op}; --dur:${b.dur}s; --tx:${b.tx}px; --ty:${b.ty}px; --rot:0deg; --sc:1; --pdur:${b.pdur}s`"
      class="shape-pulse"
    />

    <!-- Circles -->
    <circle
      v-for="s in circles" :key="'c'+s.id"
      :cx="s.cx" :cy="s.cy" :r="s.r"
      :fill="s.fill" :stroke="s.stroke" :stroke-width="s.sw"
      :style="`--op:${s.op}; --dur:${s.dur}s; --tx:${s.tx}px; --ty:${s.ty}px; --rot:${s.rot}deg; --sc:${s.sc}`"
      class="shape-float"
    />

    <!-- Rectangles / squares -->
    <rect
      v-for="s in rects" :key="'r'+s.id"
      :x="s.x" :y="s.y" :width="s.w" :height="s.h"
      :rx="s.rx"
      :fill="s.fill" :stroke="s.stroke" :stroke-width="s.sw"
      :style="`--op:${s.op}; --dur:${s.dur}s; --tx:${s.tx}px; --ty:${s.ty}px; --rot:${s.rot}deg; --sc:${s.sc}`"
      class="shape-float"
    />

    <!-- Triangles / polygons -->
    <polygon
      v-for="s in polys" :key="'p'+s.id"
      :points="s.points"
      :fill="s.fill" :stroke="s.stroke" :stroke-width="s.sw"
      :style="`--op:${s.op}; --dur:${s.dur}s; --tx:${s.tx}px; --ty:${s.ty}px; --rot:${s.rot}deg; --sc:${s.sc}`"
      class="shape-float"
    />

    <!-- Arc / ring segments -->
    <path
      v-for="s in arcs" :key="'a'+s.id"
      :d="s.d"
      :fill="s.fill" :stroke="s.stroke" :stroke-width="s.sw"
      :style="`--op:${s.op}; --dur:${s.dur}s; --tx:${s.tx}px; --ty:${s.ty}px; --rot:${s.rot}deg; --sc:${s.sc}`"
      class="shape-float"
    />

    <!-- Cross / plus marks -->
    <g
      v-for="s in crosses" :key="'x'+s.id"
      :transform="`translate(${s.cx},${s.cy}) rotate(${s.initRot})`"
      :style="`--op:${s.op}; --dur:${s.dur}s; --tx:${s.tx}px; --ty:${s.ty}px; --rot:${s.rot}deg; --sc:${s.sc}`"
      class="shape-float"
    >
      <line :x1="-s.size" y1="0" :x2="s.size" y2="0" :stroke="s.stroke" :stroke-width="s.sw" />
      <line x1="0" :y1="-s.size" x2="0" :y2="s.size" :stroke="s.stroke" :stroke-width="s.sw" />
    </g>

    <!-- Dots grid cluster -->
    <circle
      v-for="d in dots" :key="'d'+d.id"
      :cx="d.cx" :cy="d.cy" :r="d.r"
      :fill="d.fill"
      :style="`--op:${d.op}; --pdur:${d.pdur}s`"
      class="shape-pulse"
    />
  </svg>

  <!-- Main UI --
  <div class="relative z-10 flex items-center justify-center min-h-screen px-4 py-8">
    <div class="card w-full max-w-sm p-6" style="max-width:380px">

      <!-- Header --
      <div class="flex items-center justify-between mb-6">
        <button class="ctrl-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <div class="text-center">
          <p class="text-xs text-white/40 font-medium tracking-widest uppercase" style="font-family:'DM Sans'">Now Playing</p>
        </div>
        <button class="ctrl-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
          </svg>
        </button>
      </div>

      <!-- Album Art --
      <div class="album-art mb-6" style="height:220px">
        <div class="album-art-inner w-full h-full">
          <!-- Vinyl rings decorative --
          <div class="vinyl-ring" style="width:60px;height:60px;--s:12s; left:50%;top:50%;transform:translate(-50%,-50%)"></div>
          <div class="vinyl-ring" style="width:90px;height:90px;--s:18s; left:50%;top:50%;transform:translate(-50%,-50%); border-color:rgba(172,65,255,0.15)"></div>
          <div class="vinyl-ring" style="width:130px;height:130px;--s:28s; left:50%;top:50%;transform:translate(-50%,-50%); border-color:rgba(172,65,255,0.09)"></div>
          <!-- Center dot --
          <div style="width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#AC41FF,#c96aff);box-shadow:0 0 20px rgba(172,65,255,0.8);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)"></div>
          <!-- Music note icon --
          <svg width="52" height="52" viewBox="0 0 24 24" fill="none" style="position:absolute;opacity:0.18">
            <path d="M9 18V5l12-2v13" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="6" cy="18" r="3" stroke="white" stroke-width="1.5"/>
            <circle cx="18" cy="16" r="3" stroke="white" stroke-width="1.5"/>
          </svg>
        </div>
      </div>

      <!-- Track info + like --
      <div class="flex items-start justify-between mb-4">
        <div>
          <h2 class="syne text-xl font-bold text-white leading-tight">{{ currentTrack.title }}</h2>
          <p class="text-sm text-white/45 mt-0.5">{{ currentTrack.artist }}</p>
        </div>
        <div
          class="heart-btn mt-1"
          :class="{ liked: currentTrack.liked }"
          @click="toggleLike"
        >
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </div>
      </div>

      <!-- Waveform (playing indicator) --
      <div class="flex items-end gap-0.5 mb-4" style="height:24px" v-if="isPlaying">
        <div
          v-for="(h, i) in waveBars" :key="i"
          class="wave-bar"
          :style="`height:${h}px; --wd:${0.6 + Math.random()*0.7}s; animation-delay:${i*0.08}s`"
        ></div>
      </div>
      <div class="mb-4" style="height:24px; display:flex;align-items:center" v-else>
        <div class="flex items-end gap-0.5" style="height:10px">
          <div v-for="i in 18" :key="i" style="width:3px;border-radius:999px;background:rgba(255,255,255,0.15);height:4px"></div>
        </div>
      </div>

      <!-- Progress --
      <div class="mb-1">
        <div class="progress-track" @click="seekTo($event)">
          <div class="progress-fill" :style="`width:${progress}%`"></div>
        </div>
      </div>
      <div class="flex justify-between text-xs text-white/35 mb-5">
        <span>{{ currentTime }}</span>
        <span>{{ currentTrack.duration }}</span>
      </div>

      <!-- Controls --
      <div class="flex items-center justify-between mb-6">
        <button class="ctrl-btn" @click="toggleShuffle" :style="shuffle ? 'color:#AC41FF' : ''">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
            <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
          </svg>
        </button>
        <button class="ctrl-btn" @click="prevTrack">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="play-btn" @click="togglePlay">
          <svg v-if="!isPlaying" width="24" height="24" viewBox="0 0 24 24" fill="white">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <svg v-else width="24" height="24" viewBox="0 0 24 24" fill="white">
            <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
          </svg>
        </button>
        <button class="ctrl-btn" @click="nextTrack">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="ctrl-btn" @click="toggleRepeat" :style="repeat ? 'color:#AC41FF' : ''">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
            <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
        </button>
      </div>

      <!-- Volume --
      <div class="flex items-center gap-3 mb-5">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        </svg>
        <input type="range" class="flex-1" min="0" max="100" v-model="volume" />
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
      </div>

      <!-- Up Next --
      <div>
        <p class="syne text-xs font-semibold text-white/30 tracking-widest uppercase mb-3">Up Next</p>
        <div
          v-for="(track, i) in upNext" :key="track.id"
          class="queue-item"
          :class="{ active: i === 0 }"
          @click="jumpTo(i)"
        >
          <div class="flex items-center gap-3">
            <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,rgba(172,65,255,0.3),rgba(172,65,255,0.08));flex-shrink:0;display:flex;align-items:center;justify-content:center;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="rgba(172,65,255,0.8)">
                <polygon points="5 3 19 12 5 21 5 3"/>
              </svg>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium text-white truncate" style="font-family:'Syne'">{{ track.title }}</p>
              <p class="text-xs text-white/35 truncate">{{ track.artist }}</p>
            </div>
            <span class="text-xs text-white/25">{{ track.duration }}</span>
          </div>
        </div>
      </div>

    </div>
  </div>
  -->
</div>

<script>
new Vue({
  el: '#app',
  data() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    return {
      vw, vh,
      isPlaying: true,
      shuffle: false,
      repeat: false,
      volume: 72,
      progress: 34,
      currentTrackIndex: 0,

      waveBars: Array.from({ length: 18 }, () => 6 + Math.random() * 18),

      tracks: [
        { id: 1, title: 'Neon Reverie',    artist: 'Solaris Echo',  duration: '3:47', liked: true  },
        { id: 2, title: 'Hollow Orbit',    artist: 'Mira Voss',     duration: '4:12', liked: false },
        { id: 3, title: 'Glass Meridian',  artist: 'Pale Verse',    duration: '3:58', liked: false },
        { id: 4, title: 'Drift Protocol',  artist: 'Solaris Echo',  duration: '5:01', liked: true  },
        { id: 5, title: 'Static Garden',   artist: 'CLVR',          duration: '3:33', liked: false },
      ],

      // SVG shapes — generated on mount
      circles: [],
      rects:   [],
      polys:   [],
      arcs:    [],
      crosses: [],
      dots:    [],
      blooms:  [],

      // Timer
      _ticker: null,
      _waveTimer: null,
    };
  },

  computed: {
    currentTrack() {
      return this.tracks[this.currentTrackIndex];
    },
    upNext() {
      const arr = [];
      for (let i = 1; i <= 3; i++) {
        arr.push(this.tracks[(this.currentTrackIndex + i) % this.tracks.length]);
      }
      return arr;
    },
    currentTime() {
      // Derive from progress + track duration
      const parts = this.currentTrack.duration.split(':');
      const total = parseInt(parts[0]) * 60 + parseInt(parts[1]);
      const elapsed = Math.floor((this.progress / 100) * total);
      const m = Math.floor(elapsed / 60);
      const s = elapsed % 60;
      return `${m}:${s.toString().padStart(2, '0')}`;
    },
  },

  methods: {
    // ---- SVG generation ----
    rand(min, max) { return min + Math.random() * (max - min); },
    randInt(min, max) { return Math.floor(this.rand(min, max + 1)); },
    brandColor(alpha) { return `rgba(172,65,255,${alpha.toFixed(2)})`; },
    accentColor(alpha) {
      const palettes = [
        `rgba(172,65,255,${alpha.toFixed(2)})`,
        `rgba(80,30,160,${alpha.toFixed(2)})`,
        `rgba(220,110,255,${alpha.toFixed(2)})`,
        `rgba(255,255,255,${alpha.toFixed(2)})`,
      ];
      return palettes[this.randInt(0, palettes.length - 1)];
    },
    floatProps(amplitude = 30) {
      return {
        dur: this.rand(10, 22),
        tx:  this.rand(-amplitude, amplitude),
        ty:  this.rand(-amplitude, amplitude),
        rot: this.rand(-40, 40),
        sc:  this.rand(0.9, 1.15),
      };
    },

    generateShapes() {
      const { vw, vh } = this;
      const r = this.rand.bind(this);
      const ri = this.randInt.bind(this);

      // Grid helper: divide screen into zones for natural distribution
      const COLS = 6, ROWS = 8;
      const cw = vw / COLS, ch = vh / ROWS;
      const zonePick = (cx, cy) => ({
        cx: cx * cw + r(cw * 0.1, cw * 0.9),
        cy: cy * ch + r(ch * 0.1, ch * 0.9),
      });

      // Blooms (large soft glows)
      this.blooms = [
        { id:0, cx: vw*0.15, cy: vh*0.2,  rx:280, ry:220, op:0.35, dur:16, tx:20, ty:-15, pdur:6   },
        { id:1, cx: vw*0.85, cy: vh*0.75, rx:320, ry:260, op:0.28, dur:20, tx:-25,ty:20,  pdur:8   },
        { id:2, cx: vw*0.5,  cy: vh*0.5,  rx:180, ry:140, op:0.12, dur:18, tx:10, ty:-10, pdur:10  },
      ];

      // Circles (30)
      this.circles = Array.from({ length: 5 }, (_, i) => {
        const col = i % COLS, row = Math.floor(i / COLS) % ROWS;
        const pos = zonePick(col, row);
        const filled = Math.random() > 0.5;
        const big = Math.random() > 0.75;
        const radius = big ? r(30, 80) : r(4, 24);
        return {
          id: i,
          ...pos,
          r: radius,
          fill: filled ? this.brandColor(r(0.04, 0.15)) : 'none',
          stroke: this.accentColor(r(0.08, 0.35)),
          sw: r(0.5, filled ? 0 : 1.5),
          op: r(0.12, 0.45),
          ...this.floatProps(big ? 40 : 20),
        };
      });

      // Rects (16)
      this.rects = Array.from({ length: 4 }, (_, i) => {
        const col = (i * 2) % COLS, row = Math.floor(i / 3) % ROWS;
        const pos = zonePick(col, row);
        const size = r(12, 55);
        const filled = Math.random() > 0.6;
        const isSquare = Math.random() > 0.4;
        const w = size, h = isSquare ? size : size * r(0.4, 2.5);
        return {
          id: i,
          x: pos.cx - w/2, y: pos.cy - h/2,
          w, h,
          rx: r(0, Math.min(w, h) * 0.35),
          fill: filled ? this.brandColor(r(0.04, 0.12)) : 'none',
          stroke: this.accentColor(r(0.1, 0.3)),
          sw: r(0.5, 1.5),
          op: r(0.1, 0.4),
          ...this.floatProps(25),
        };
      });

      // Polygons / triangles (12)
      this.polys = Array.from({ length: 2 }, (_, i) => {
        const col = (i * 3) % COLS, row = (i * 2) % ROWS;
        const pos = zonePick(col, row);
        const size = r(10, 40);
        const sides = [3, 4, 5, 6][ri(0, 3)];
        const pts = [];
        for (let s = 0; s < sides; s++) {
          const a = (s / sides) * Math.PI * 2 - Math.PI / 2;
          const jitter = r(0.8, 1.2);
          pts.push(`${pos.cx + Math.cos(a) * size * jitter},${pos.cy + Math.sin(a) * size * jitter}`);
        }
        return {
          id: i,
          points: pts.join(' '),
          fill: Math.random() > 0.5 ? this.brandColor(r(0.04, 0.12)) : 'none',
          stroke: this.accentColor(r(0.12, 0.35)),
          sw: r(0.5, 1.5),
          op: r(0.1, 0.4),
          ...this.floatProps(20),
        };
      });

      // Arcs (14) — ring segments
      this.arcs = Array.from({ length: 4 }, (_, i) => {
        const col = (i + 1) % COLS, row = (i * 3) % ROWS;
        const pos = zonePick(col, row);
        const R = r(18, 60);
        const startA = r(0, Math.PI * 1.5);
        const sweep  = r(0.4, 1.4);
        const endA   = startA + sweep;
        const x1 = pos.cx + Math.cos(startA) * R;
        const y1 = pos.cy + Math.sin(startA) * R;
        const x2 = pos.cx + Math.cos(endA) * R;
        const y2 = pos.cy + Math.sin(endA) * R;
        const large = sweep > Math.PI ? 1 : 0;
        return {
          id: i,
          d: `M ${x1} ${y1} A ${R} ${R} 0 ${large} 1 ${x2} ${y2}`,
          fill: 'none',
          stroke: this.accentColor(r(0.15, 0.45)),
          sw: r(0.8, 2.5),
          op: r(0.12, 0.42),
          ...this.floatProps(22),
        };
      });

      // Crosses (10)
      this.crosses = Array.from({ length: 3 }, (_, i) => {
        const col = (i * 4) % COLS, row = (i * 5) % ROWS;
        const pos = zonePick(col, row);
        return {
          id: i,
          cx: pos.cx, cy: pos.cy,
          size: r(6, 20),
          initRot: r(0, 45),
          stroke: this.accentColor(r(0.15, 0.4)),
          sw: r(0.8, 1.8),
          op: r(0.1, 0.35),
          ...this.floatProps(15),
        };
      });

      // Dots (scattered cluster groups)
      const dotBases = Array.from({ length: 2 }, (_, i) => ({
        cx: r(0, vw), cy: r(0, vh),
      }));
      this.dots = [];
      let dId = 0;
      dotBases.forEach(base => {
        const count = ri(4, 9);
        for (let j = 0; j < count; j++) {
          this.dots.push({
            id: dId++,
            cx: base.cx + r(-40, 40),
            cy: base.cy + r(-40, 40),
            r:  r(1.2, 3.5),
            fill: this.accentColor(r(0.5, 1)),
            op: r(0.1, 0.35),
            pdur: r(2.5, 6),
          });
        }
      });
    },

    // ---- Playback ----
    togglePlay() {
      this.isPlaying = !this.isPlaying;
      if (this.isPlaying) this.startTicker();
      else clearInterval(this._ticker);
    },
    startTicker() {
      clearInterval(this._ticker);
      this._ticker = setInterval(() => {
        if (this.progress >= 100) {
          this.nextTrack();
        } else {
          this.progress += 0.05;
        }
      }, 100);
    },
    nextTrack() {
      this.currentTrackIndex = (this.currentTrackIndex + 1) % this.tracks.length;
      this.progress = 0;
    },
    prevTrack() {
      if (this.progress > 5) {
        this.progress = 0;
      } else {
        this.currentTrackIndex = (this.currentTrackIndex - 1 + this.tracks.length) % this.tracks.length;
        this.progress = 0;
      }
    },
    jumpTo(i) {
      this.currentTrackIndex = (this.currentTrackIndex + i + 1) % this.tracks.length;
      this.progress = 0;
    },
    toggleLike() {
      this.tracks[this.currentTrackIndex].liked = !this.tracks[this.currentTrackIndex].liked;
    },
    toggleShuffle() { this.shuffle = !this.shuffle; },
    toggleRepeat()  { this.repeat  = !this.repeat;  },
    seekTo(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      this.progress = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
    },

    // Wave bar randomizer
    randomizeWave() {
      this.waveBars = Array.from({ length: 18 }, () => 6 + Math.random() * 18);
    },
  },

  mounted() {
    this.generateShapes();
    this.startTicker();
    this._waveTimer = setInterval(this.randomizeWave, 600);
  },

  beforeDestroy() {
    clearInterval(this._ticker);
    clearInterval(this._waveTimer);
  },
});
</script>
</body>
</html>
