<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staggered List</title>
  <link rel="stylesheet" href="staggered_list.css">
</head>

<body>
 <h1>Staggered List</h1>
    <p class="subtitle">EP. 08 · :nth-child + animation-delay · @Barmajli</p>

    <div class="demo-grid">
      <div class="demo-card">
        <h3>Slide In From Left</h3>
        <div class="stagger-list" id="list1">
          <div class="stagger-item" style="--i: 1">
            <span class="stagger-icon">🚀</span> Deploy to production
          </div>
          <div class="stagger-item" style="--i: 2">
            <span class="stagger-icon">✅</span> Run test suite
          </div>
          <div class="stagger-item" style="--i: 3">
            <span class="stagger-icon">🔍</span> Code review done
          </div>
          <div class="stagger-item" style="--i: 4">
            <span class="stagger-icon">📦</span> Package updated
          </div>
          <div class="stagger-item" style="--i: 5">
            <span class="stagger-icon">🎉</span> Ship it!
          </div>
        </div>
        <button class="replay-btn" onclick="replay('list1')">↺ Replay</button>
      </div>
      <div class="demo-card">
        <h3>Rise Up From Below</h3>
        <div class="card-list" id="list2">
          <div class="card-item">
            <div
              class="card-avatar"
              style="background: linear-gradient(135deg, #ff6fd8, #3bc4f2)"
            ></div>
            <div class="card-info">
              <div class="card-name">Alex Chen</div>
              <div class="card-role">Front-end Dev</div>
            </div>
          </div>
          <div class="card-item">
            <div
              class="card-avatar"
              style="background: linear-gradient(135deg, #3bc4f2, #ffdd57)"
            ></div>
            <div class="card-info">
              <div class="card-name">Sara Kim</div>
              <div class="card-role">UI Designer</div>
            </div>
          </div>
          <div class="card-item">
            <div
              class="card-avatar"
              style="background: linear-gradient(135deg, #ffdd57, #14ffb4)"
            ></div>
            <div class="card-info">
              <div class="card-name">Marco Rossi</div>
              <div class="card-role">CSS Wizard</div>
            </div>
          </div>
          <div class="card-item">
            <div
              class="card-avatar"
              style="background: linear-gradient(135deg, #14ffb4, #a855f7)"
            ></div>
            <div class="card-info">
              <div class="card-name">Priya Nair</div>
              <div class="card-role">Full Stack</div>
            </div>
          </div>
        </div>
        <button class="replay-btn" onclick="replay('list2')">↺ Replay</button>
      </div>
    </div>
    
    <script src="staggered_list.js" type="text/javascript" charset="utf-8"></script>
</body>

</html>
