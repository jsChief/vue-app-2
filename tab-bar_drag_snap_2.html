<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="./js/TW4.js"></script>
  <script src="./js/vue2.js"></script>
  <style>
    .tab-slider {
      position: absolute;
      top: 4px; bottom: 4px;
      border-radius: 15px;
      z-index: 0;
      transition: background 0.35s ease;
      pointer-events: none;
    }
    .tab-slider.snapping {
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1),
      width 0.3s cubic-bezier(0.4, 0, 0.2, 1),
      background 0.35s ease;
    }
    .tab-btn {
      position: relative;
      z-index: 1;
      transition: color 0.3s ease;
      user-select: none;
    }
    .drag-handle {
      position: absolute;
      top: 4px; bottom: 4px;
      border-radius: 15px;
      z-index: 2;
      cursor: grab;
      -webkit-tap-highlight-color: transparent;
    }
    .drag-handle:active { cursor: grabbing; }
  </style>
</head>
<body class="bg-[#0e0e12] flex items-center justify-center min-h-screen px-4">

<div id="app" class="w-full max-w-md">
  
  <div
    class="relative flex rounded-3xl p-1"
    style="background:#18181f; border:1px solid #2a2a36;"
    ref="bar"
  >
    <!-- Pill (purely visual, no pointer events) -->
    <div
      class="tab-slider"
      :class="[{ snapping: isSnapping }, 'bg-'+tabs[activeTab].color+'-600']"
      :style="{ left: sliderLeft + 'px', width: sliderWidth + 'px'}"
    ></div>

    <!-- Tab buttons -->
    <button
      v-for="(tab, i) in tabs"
      :key="tab.id"
      :ref="'tab_' + i"
      class="tab-btn flex-1 py-2 px-3 text-sm rounded-lg text-center"
      :style="{ color: activeTab === i ? '#fff' : '#666' }"
      @click="switchTab(i)"
    >
      {{ tab.label }}
    </button>

    <!-- Invisible drag handle — floats above buttons, tracks pill position -->
    <div
      class="drag-handle"
      :style="{ left: sliderLeft + 'px', width: sliderWidth + 'px' }"
      @mousedown="onDragStart"
      @touchstart.prevent="onDragStart"
    ></div>
  </div>
  
  

</div>

<script>
new Vue({
  el: '#app',
  data() {
    return {
      activeTab: 0,
      sliderLeft: 0,
      sliderWidth: 0,
      isSnapping: false,

      // Drag state
      dragging: false,
      dragStartX: 0,
      dragStartLeft: 0,

      tabs: [
        { id: 'approved',    label: 'Approved',    color: 'green' },
        { id: 'pending', label: 'Pending', color: 'orange' },
        { id: 'rejected',     label: 'Rejected',     color: 'red' },
      ]
    }
  },

  mounted() {
    this.$nextTick(() => this.setSliderToTab(0))
    window.addEventListener('resize', () => this.setSliderToTab(this.activeTab))
    window.addEventListener('mousemove', this.onDragMove)
    window.addEventListener('mouseup',   this.onDragEnd)
    window.addEventListener('touchmove', this.onDragMove, { passive: false })
    window.addEventListener('touchend',  this.onDragEnd)
  },

  beforeDestroy() {
    window.removeEventListener('mousemove', this.onDragMove)
    window.removeEventListener('mouseup',   this.onDragEnd)
    window.removeEventListener('touchmove', this.onDragMove)
    window.removeEventListener('touchend',  this.onDragEnd)
  },

  methods: {
    // Get the left offset and width of a tab button relative to the bar
    getTabRect(i) {
      const bar = this.$refs.bar
      const btn = this.$refs['tab_' + i]
      const el  = Array.isArray(btn) ? btn[0] : btn
      const barRect = bar.getBoundingClientRect()
      const btnRect = el.getBoundingClientRect()
      return { left: btnRect.left - barRect.left, width: btnRect.width }
    },

    setSliderToTab(i, animate = false) {
      const { left, width } = this.getTabRect(i)
      if (animate) {
        this.isSnapping = true
        setTimeout(() => { this.isSnapping = false }, 320)
      }
      this.sliderLeft  = left
      this.sliderWidth = width
      this.activeTab   = i
    },

    switchTab(i) {
      this.setSliderToTab(i, true)
    },

    // Resolve which tab the slider centre is closest to
    nearestTab(sliderCenterX) {
      let closest = 0, minDist = Infinity
      this.tabs.forEach((_, i) => {
        const { left, width } = this.getTabRect(i)
        const dist = Math.abs((left + width / 2) - sliderCenterX)
        if (dist < minDist) { minDist = dist; closest = i }
      })
      return closest
    },

    // ── Drag handlers ──────────────────────────────────────────
    onDragStart(e) {
      this.dragging     = true
      this.isSnapping   = false
      this.dragStartX   = e.touches ? e.touches[0].clientX : e.clientX
      this.dragStartLeft = this.sliderLeft
    },

    onDragMove(e) {
      if (!this.dragging) return
      e.preventDefault()
      const clientX = e.touches ? e.touches[0].clientX : e.clientX
      const dx = clientX - this.dragStartX

      // Clamp within bar padding
      const bar       = this.$refs.bar
      const barWidth  = bar.getBoundingClientRect().width
      const minLeft   = 4
      const maxLeft   = barWidth - this.sliderWidth - 4
      this.sliderLeft = Math.min(Math.max(this.dragStartLeft + dx, minLeft), maxLeft)

      // Highlight nearest tab label while dragging
      const center    = this.sliderLeft + this.sliderWidth / 2
      this.activeTab  = this.nearestTab(center)
    },

    onDragEnd() {
      if (!this.dragging) return
      this.dragging = false
      // Snap to nearest tab
      this.setSliderToTab(this.activeTab, true)
    }
  }
})
</script>
</body>
</html>
