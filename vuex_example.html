<!DOCTYPE html>
<html>
<head>
  <title>Vue 2 + Vuex + Router</title>
</head>
<body>
  <div id="app">
    <nav>
      <router-link to="/">Home</router-link> |
      <router-link to="/users">Users</router-link>
    </nav>
    <router-view></router-view>
  </div>
  
  <!--
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vuex@3/dist/vuex.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-router@3/dist/vue-router.js"></script>
  -->
  <script src="./js/vue2.js"></script>
  <script src="./js/vuex3.6.2.js"></script>
  <script src="./js/vue-router3.js"></script>

  <script>
    // ─── STORE ───────────────────────────────────────────────
    const store = new Vuex.Store({
      state: {
        users: [],
        loading: false,
        error: null
      },
      getters: {
        allUsers: state => state.users,
        userById: state => id => state.users.find(u => u.id === id)
      },
      mutations: {
        SET_USERS(state, users) {
          state.users = users
        },
        SET_LOADING(state, status) {
          state.loading = status
        },
        SET_ERROR(state, error) {
          state.error = error
        }
      },
      actions: {
        async fetchUsers({ commit }) {
          commit('SET_LOADING', true)
          commit('SET_ERROR', null)
          try {
            const res = await fetch('https://jsonplaceholder.typicode.com/users')
            const users = await res.json()
            commit('SET_USERS', users)
          } catch (err) {
            commit('SET_ERROR', 'Failed to fetch users')
          } finally {
            commit('SET_LOADING', false)
          }
        }
      }
    })

    // ─── COMPONENTS ──────────────────────────────────────────
    const HomePage = {
      template: `
        <div>
          <h2>Home</h2>
          <p>Go to <router-link to="/users">Users</router-link> to see fetched data.</p>
        </div>
      `
    }

    const UsersPage = {
      template: `
        <div>
          <h2>Users</h2>
          <p v-if="loading">Loading...</p>
          <p v-else-if="error" style="color:red">{{ error }}</p>
          <ul v-else>
            <li v-for="user in users" :key="user.id">
              <router-link :to="'/users/' + user.id">
                {{ user.name }} — {{ user.email }}
              </router-link>
            </li>
          </ul>
        </div>
      `,
      computed: {
        users()   { return this.$store.getters.allUsers },
        loading() { return this.$store.state.loading },
        error()   { return this.$store.state.error }
      },
      created() {
        // Only fetch if not already loaded
        if (this.$store.state.users.length === 0) {
          this.$store.dispatch('fetchUsers')
        }
      }
    }

    const UserDetailPage = {
      template: `
        <div v-if="user">
          <h2>{{ user.name }}</h2>
          <p>Email: {{ user.email }}</p>
          <p>Phone: {{ user.phone }}</p>
          <p>Company: {{ user.company.name }}</p>
          <router-link to="/users">← Back to Users</router-link>
        </div>
      `,
      computed: {
        user() {
          const id = parseInt(this.$route.params.id)
          return this.$store.getters.userById(id)
        }
      }
    }

    // ─── ROUTER ──────────────────────────────────────────────
    const router = new VueRouter({
      routes: [
        { path: '/',          component: HomePage },
        { path: '/users',     component: UsersPage },
        { path: '/users/:id', component: UserDetailPage }
      ]
    })

    // ─── ROOT INSTANCE ───────────────────────────────────────
    new Vue({
      el: '#app',
      store,
      router
    })
  </script>
</body>
</html>
